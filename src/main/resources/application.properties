spring.application.name=shopex

spring.datasource.url=jdbc:mysql://localhost:3306/ex4?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=shopex
spring.datasource.password=shopex
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Keep the persistence context out of view rendering: every association a
# template needs is fetched in the repository/service layer instead.
spring.jpa.open-in-view=false

# Static assets (Bootstrap, product images) get a content hash in their URL and
# a one-year cache lifetime. Because the hash changes whenever the file does, a
# repeat visitor re-uses the cached copy instead of re-downloading it, and an
# edited file is never served stale.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Track the session by cookie only. Servlet containers otherwise fall back to
# appending ;jsessionid=... to URLs for clients that have not returned a cookie
# yet, which puts a live session id into redirect headers, browser history and
# anything the Referer header reaches.
server.servlet.session.tracking-modes=cookie

# Template caching is left at its default (on). devtools is on the classpath in
# development and switches it off there, and it is excluded from the packaged
# jar — so templates are re-read while developing and cached in production.
spring.devtools.restart.enabled=true
