spring.application.name=shopex

spring.datasource.url=jdbc:mysql://localhost:3306/ex4?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=shopex
spring.datasource.password=shopex
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Keep the persistence context out of view rendering: every association a
# template needs is fetched in the repository/service layer instead.
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true
