<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Home')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="p-4 p-md-5 mb-4 bg-body-tertiary rounded-3">
        <div class="row">
            <div class="col-12 col-lg-8">
                <h1 class="display-6 fw-bold">Welcome to ShopEx</h1>
                <p class="text-body-secondary">Browse the catalogue, fill your cart, and check out — no account needed until you order.</p>
                <form class="row g-2" th:action="@{/products}" method="get">
                    <div class="col-12 col-md-8">
                        <label for="q" class="visually-hidden">Search products</label>
                        <input type="text" class="form-control" id="q" name="q" placeholder="Search by name..."/>
                    </div>
                    <div class="col-12 col-md-4 d-grid">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <h2 class="h4 mb-3">Featured products</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"
         th:if="${featuredProducts != null and !featuredProducts.isEmpty()}">
        <div class="col" th:each="product : ${featuredProducts}">
            <div class="card h-100">
                <div class="ratio ratio-4x3" th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}">
                    <img class="card-img-top object-fit-cover" th:src="${product.imageUrl}" alt=""/>
                </div>
                <div class="card-body d-flex flex-column">
                    <h3 class="card-title h6" th:text="${product.name}">Product name</h3>
                    <p class="card-text fw-semibold mt-auto" th:text="${product.price} + ' ₪'">0 ₪</p>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/products/{id}(id=${product.id})}">View details</a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${featuredProducts == null or featuredProducts.isEmpty()}">
        <a th:href="@{/products}">Browse all products &rarr;</a>
    </p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
