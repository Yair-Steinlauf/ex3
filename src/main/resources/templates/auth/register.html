<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Register')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <h1>Create an account</h1>

    <form class="form" th:action="@{/register}" th:object="${registrationForm}" method="post">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" th:field="*{firstName}"/>
        <span class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First name error</span>

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" th:field="*{lastName}"/>
        <span class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last name error</span>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}"/>
        <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</span>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}"/>
        <span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</span>

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"/>
        <span class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm password error</span>

        <button class="btn" type="submit" style="margin-top: 1rem;">Register</button>
    </form>

    <p style="margin-top: 1rem;">
        Already have an account? <a th:href="@{/login}">Login here</a>
    </p>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
