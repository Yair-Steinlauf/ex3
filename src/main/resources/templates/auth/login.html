<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Login')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <h1>Login</h1>

    <p class="alert alert-error" th:if="${param.error}">
        Invalid email or password. Please try again.
    </p>
    <p class="alert alert-success" th:if="${param.logout}">
        You have been logged out.
    </p>

    <form class="form" th:action="@{/login}" method="post">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" required="required" autofocus="autofocus"/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required="required"/>

        <button class="btn" type="submit" style="margin-top: 1rem;">Login</button>
    </form>

    <p style="margin-top: 1rem;">
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </p>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
