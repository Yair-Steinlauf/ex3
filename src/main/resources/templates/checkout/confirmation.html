<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Order Confirmation')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1 class="h3 mb-3">Order Confirmed</h1>
    <div class="alert alert-success">
        Thank you! Your order #<span th:text="${order.id}">1</span> has been placed.
    </div>

    <dl class="row col-12 col-md-8 col-lg-6">
        <dt class="col-5 col-md-4">Status</dt>
        <dd class="col-7 col-md-8" th:text="${order.status}">PENDING</dd>
        <dt class="col-5 col-md-4">Placed</dt>
        <dd class="col-7 col-md-8" th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">date</dd>
    </dl>

    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Product</th>
                <th scope="col">Quantity</th>
                <th scope="col">Price at purchase</th>
                <th scope="col">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.product.name}">Product</td>
                <td th:text="${item.quantity}">1</td>
                <td th:text="${item.priceAtPurchase} + ' ₪'">0 ₪</td>
                <td th:text="${item.priceAtPurchase * item.quantity} + ' ₪'">0 ₪</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2 class="h4">Total: <span th:text="${order.totalAmount} + ' ₪'">0 ₪</span></h2>

    <a class="btn btn-primary mt-3" th:href="@{/}">Continue shopping</a>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
