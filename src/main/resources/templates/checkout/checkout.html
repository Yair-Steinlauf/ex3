<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Checkout')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <h1>Checkout</h1>

    <p class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">Error</p>

    <div th:if="${cartItems == null or cartItems.isEmpty()}">
        <p>Your cart is empty. <a th:href="@{/products}">Browse products</a></p>
    </div>

    <div th:if="${cartItems != null and !cartItems.isEmpty()}">
        <h2>Order summary</h2>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Unit price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.name}">Product</td>
                    <td th:text="${item.unitPrice} + ' ₪'">0 ₪</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="${item.subtotal} + ' ₪'">0 ₪</td>
                </tr>
                </tbody>
            </table>
        </div>

        <h2>Total: <span th:text="${cartTotal} + ' ₪'">0 ₪</span></h2>

        <form th:action="@{/checkout/place}" method="post">
            <button class="btn" type="submit">Place order</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
