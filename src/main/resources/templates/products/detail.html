<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head(title=${product.name})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <p><a th:href="@{/products}">&larr; Back to products</a></p>

    <div class="card" style="display: flex; gap: 1.5rem; flex-wrap: wrap;">
        <img th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
             th:src="${product.imageUrl}" alt=""
             style="max-width: 320px; width: 100%; border-radius: var(--radius);"/>
        <div style="flex: 1; min-width: 250px;">
            <h1 th:text="${product.name}">Product name</h1>
            <p th:if="${product.category != null}" style="color: var(--color-muted);" th:text="${product.category.name}">Category</p>
            <p style="font-size: 1.4rem; font-weight: 700;" th:text="${product.price} + ' ₪'">0 ₪</p>
            <p th:text="${product.description}">Description</p>
            <p th:if="${product.stock > 0}" th:text="'In stock: ' + ${product.stock}">In stock</p>
            <p th:unless="${product.stock > 0}" class="error-text">Out of stock</p>

            <p th:if="${!reviews.isEmpty()}">
                Average rating:
                <strong th:text="${#numbers.formatDecimal(averageRating, 1, 1)} + ' / 5'">0 / 5</strong>
                (<span th:text="${reviews.size()}">0</span> review(s))
            </p>
            <p th:if="${reviews.isEmpty()}">No reviews yet.</p>

            <form class="form" th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}"/>
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1" th:max="${product.stock}"/>
                <button class="btn" type="submit" style="margin-top: 0.75rem;" th:disabled="${product.stock == 0}">Add to cart</button>
            </form>
        </div>
    </div>

    <section style="margin-top: 2rem;">
        <h2>Reviews</h2>

        <div class="card" th:each="review : ${reviews}" style="margin-bottom: 0.75rem;">
            <strong th:text="${review.rating} + ' / 5'">5 / 5</strong>
            <span th:if="${review.user != null}" style="color: var(--color-muted);"
                  th:text="'by ' + ${review.user.firstName} + ' ' + ${review.user.lastName}">by User</span>
            <p th:if="${review.comment != null and !review.comment.isEmpty()}" th:text="${review.comment}">Comment</p>
        </div>

        <div sec:authorize="isAuthenticated()">
            <h3>Write a review</h3>
            <p th:if="${reviewError != null}" class="alert alert-error" th:text="${reviewError}">Error</p>
            <form class="form" th:action="@{/products/{id}/reviews(id=${product.id})}" method="post" th:object="${reviewForm}">
                <label for="rating">Rating</label>
                <select id="rating" th:field="*{rating}">
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Good</option>
                    <option value="3">3 - Average</option>
                    <option value="2">2 - Poor</option>
                    <option value="1">1 - Terrible</option>
                </select>
                <p class="error-text" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}">Rating error</p>

                <label for="comment">Comment</label>
                <textarea id="comment" th:field="*{comment}" rows="3"></textarea>
                <p class="error-text" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}">Comment error</p>

                <button class="btn" type="submit" style="margin-top: 0.75rem;">Submit review</button>
            </form>
        </div>
        <div sec:authorize="isAnonymous()">
            <p><a th:href="@{/login}">Log in</a> to write a review.</p>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
