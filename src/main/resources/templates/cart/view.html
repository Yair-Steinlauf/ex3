<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Cart')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1 class="h3 mb-4">Your Cart</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}">Success</div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

    <div th:if="${cartItems == null or cartItems.isEmpty()}">
        <p>Your cart is empty. <a th:href="@{/products}">Browse products</a></p>
    </div>

    <div th:if="${cartItems != null and !cartItems.isEmpty()}">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th scope="col">Product</th>
                    <th scope="col">Unit price</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Subtotal</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.name}">Product</td>
                    <td th:text="${item.unitPrice} + ' ₪'">0 ₪</td>
                    <td>
                        <form th:action="@{/cart/update}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="productId" th:value="${item.productId}"/>
                            <label class="visually-hidden" th:for="'qty-' + ${item.productId}">Quantity</label>
                            <input type="number" class="form-control form-control-sm" name="quantity" min="1"
                                   th:id="'qty-' + ${item.productId}" th:value="${item.quantity}"/>
                            <button class="btn btn-sm btn-outline-secondary" type="submit">Update</button>
                        </form>
                    </td>
                    <td th:text="${item.subtotal} + ' ₪'">0 ₪</td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="productId" th:value="${item.productId}"/>
                            <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <h2 class="h4 mb-0">Total: <span th:text="${cartTotal} + ' ₪'">0 ₪</span></h2>
            <a class="btn btn-primary" th:href="@{/checkout}">Proceed to checkout</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
