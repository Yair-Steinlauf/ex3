<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Manage Products')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
        <h1 class="h3 mb-0">Manage Products</h1>
        <a class="btn btn-primary" th:href="@{/admin/products/new}">+ New Product</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}">Success</div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Category</th>
                <th scope="col">Price</th>
                <th scope="col">Stock</th>
                <th scope="col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Name</td>
                <td th:text="${product.category != null ? product.category.name : '—'}">Category</td>
                <td th:text="${product.price} + ' ₪'">0</td>
                <td th:text="${product.stock}">0</td>
                <td>
                    <div class="d-flex gap-2">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/admin/products/{id}/edit(id=${product.id})}">Edit</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                              th:attr="data-product-name=${product.name}"
                              onsubmit="return confirm('Delete product: ' + this.dataset.productName + '\nThis cannot be undone.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${products == null or products.isEmpty()}">
                <td colspan="6" class="text-body-secondary">No products yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
