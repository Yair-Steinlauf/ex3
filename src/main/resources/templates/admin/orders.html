<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Manage Orders')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1 class="h3 mb-4">Manage Orders</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}">Success</div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">User</th>
                <th scope="col">Date</th>
                <th scope="col">Total</th>
                <th scope="col">Status</th>
                <th scope="col">Update status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${order.user != null ? order.user.email : '—'}">user@example.com</td>
                <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                <td th:text="${order.totalAmount} + ' ₪'">0</td>
                <td><span class="badge text-bg-secondary" th:text="${order.status}">PENDING</span></td>
                <td>
                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"
                          class="d-flex gap-2">
                        <label class="visually-hidden" th:for="'status-' + ${order.id}">Status</label>
                        <select class="form-select form-select-sm" name="status" th:id="'status-' + ${order.id}">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${s == order.status}">STATUS</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Update</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${orders == null or orders.isEmpty()}">
                <td colspan="6" class="text-body-secondary">No orders yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
