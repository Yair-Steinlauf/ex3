<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Admin Dashboard')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1 class="h3 mb-4">Admin Dashboard</h1>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col">
            <div class="card h-100">
                <div class="card-body">
                    <p class="display-6 mb-0" th:text="${totalProducts}">0</p>
                    <p class="text-body-secondary">Total products</p>
                    <a class="stretched-link" th:href="@{/admin/products}">Manage products &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card h-100">
                <div class="card-body">
                    <p class="display-6 mb-0" th:text="${pendingOrders}">0</p>
                    <p class="text-body-secondary">Pending orders</p>
                    <a class="stretched-link" th:href="@{/admin/orders}">Manage orders &rarr;</a>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card h-100">
                <div class="card-body">
                    <p class="display-6 mb-0" th:text="${totalUsers}">0</p>
                    <p class="text-body-secondary">Total users</p>
                    <a class="stretched-link" th:href="@{/admin/users}">Manage users &rarr;</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
