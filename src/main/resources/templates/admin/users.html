<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title='Manage Users')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1 class="h3 mb-4">Manage Users</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}">Success</div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Role</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.firstName} + ' ' + ${u.lastName}">Name</td>
                <td th:text="${u.email}">email@example.com</td>
                <td th:text="${u.role}">USER</td>
                <td>
                    <span class="badge" th:classappend="${u.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${u.enabled} ? 'Enabled' : 'Disabled'">Enabled</span>
                </td>
                <td>
                    <span th:if="${currentUserEmail != null and #strings.equalsIgnoreCase(currentUserEmail, u.email)}"
                          class="text-body-secondary small">(this is you)</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            th:unless="${currentUserEmail != null and #strings.equalsIgnoreCase(currentUserEmail, u.email)}"
                            data-bs-toggle="modal" th:attr="data-bs-target=|#toggleUser${u.id}|"
                            th:text="${u.enabled} ? 'Disable' : 'Enable'">Toggle</button>
                </td>
            </tr>
            <tr th:if="${users == null or users.isEmpty()}">
                <td colspan="6" class="text-body-secondary">No users yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Outside .table-responsive so its overflow cannot clip the dialog. -->
    <div class="modal fade"
         th:each="u : ${users}"
         th:unless="${currentUserEmail != null and #strings.equalsIgnoreCase(currentUserEmail, u.email)}"
         th:id="|toggleUser${u.id}|" tabindex="-1"
         th:attr="aria-labelledby=|toggleUserLabel${u.id}|" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" th:id="|toggleUserLabel${u.id}|"
                        th:text="${u.enabled} ? 'Disable user' : 'Enable user'">Toggle user</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">
                        <span th:text="${u.enabled} ? 'Disable' : 'Enable'">Disable</span>
                        user <strong th:text="${u.email}">user@example.com</strong>?
                    </p>
                    <p class="text-body-secondary small mb-0 mt-2" th:if="${u.enabled}">
                        They will be signed out immediately and cannot log in again until re-enabled.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form th:action="@{/admin/users/{id}/toggle-enabled(id=${u.id})}" method="post">
                        <button type="submit" class="btn"
                                th:classappend="${u.enabled} ? 'btn-danger' : 'btn-primary'"
                                th:text="${u.enabled} ? 'Disable' : 'Enable'">Confirm</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
