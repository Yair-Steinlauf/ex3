<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title=${formTitle})}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <div class="row">
        <div class="col-12 col-md-10 col-lg-7">
            <h1 class="h3 mb-4" th:text="${formTitle}">Product Form</h1>

            <form th:action="${productId == null} ? @{/admin/products} : @{/admin/products/{id}(id=${productId})}"
                  th:object="${productForm}" method="post" class="row g-3">

                <div class="col-12">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <label for="price" class="form-label">Price</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="price" th:field="*{price}"
                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <label for="stock" class="form-label">Stock</label>
                    <input type="number" step="1" min="0" class="form-control" id="stock" th:field="*{stock}"
                           th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Stock error</div>
                </div>

                <div class="col-12 col-lg-4">
                    <label for="categoryId" class="form-label">Category</label>
                    <select class="form-select" id="categoryId" th:field="*{categoryId}">
                        <option value="">-- none --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="imageUrl" class="form-label">Image URL</label>
                    <input type="text" class="form-control" id="imageUrl" th:field="*{imageUrl}"
                           th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}">Image URL error</div>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/products}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
