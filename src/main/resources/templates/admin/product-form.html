<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head(title=${formTitle})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main>
    <h1 th:text="${formTitle}">Product Form</h1>

    <form th:action="${productId == null} ? @{/admin/products} : @{/admin/products/{id}(id=${productId})}"
          th:object="${productForm}" method="post" class="form">

        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}"/>
        <span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</span>

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" rows="4"></textarea>
        <span class="error-text" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</span>

        <label for="price">Price</label>
        <input type="number" step="0.01" min="0" id="price" th:field="*{price}"/>
        <span class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</span>

        <label for="stock">Stock</label>
        <input type="number" step="1" min="0" id="stock" th:field="*{stock}"/>
        <span class="error-text" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Stock error</span>

        <label for="imageUrl">Image URL</label>
        <input type="text" id="imageUrl" th:field="*{imageUrl}"/>
        <span class="error-text" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}">Image URL error</span>

        <label for="categoryId">Category</label>
        <select id="categoryId" th:field="*{categoryId}">
            <option value="">-- none --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
        </select>

        <p>
            <button class="btn" type="submit">Save</button>
            <a th:href="@{/admin/products}">Cancel</a>
        </p>
    </form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
